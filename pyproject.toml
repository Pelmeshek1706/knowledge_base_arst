[project]
name = "personal-kb"
version = "0.1.0"
description = "Local-first GraphRAG knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "langchain-core>=1.1.2",
    "langchain>=1.1.2",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "mammoth>=1.8.0",
    "markdown>=3.7",
    "neo4j>=6.0.3",
    "openpyxl>=3.1.5",
    "openai>=2.9.0",
    "pdfplumber>=0.11.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.1",
    "pymupdf>=1.24.14",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.2",
    "sentence-transformers>=3.3.1",
    "torch>=2.5.1",
    "transformers>=4.46.3",
    "pandas>=3.0.3",
]

[project.scripts]
kb = "personal_kb.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["personal_kb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
