project:
  name: personal_kb
  config_path: configs/default.yaml
  path_mode: relative

storage:
  data_dir: data
  kb_storage_dir: kb_storage
  benchmark_dir: benchmark

neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: change-me
  database: knowledge_base3
  fallback_database: neo4j

models:
  llm:
    provider: lmstudio_openai_compatible
    base_url: http://localhost:1234/v1
    api_key: lm-studio
    model_name: mlx-qwen3.5-9b-claude-4.6-opus-reasoning-distilled-v2
    runtime: mlx-lm
    quantization: mixed_precision_4bit
    role: production_default
    default_thinking_mode: non_thinking
    structured_output_retries: 2
    allow_structured_output_reasoning_fallback: true
    timeout_seconds: 60.0
  extraction:
    provider: lmstudio_openai_compatible
    base_url: http://localhost:1234/v1
    api_key: lm-studio
    model_name: qwen2.5-1.5b-instruct
    runtime: mlx-lm
    quantization: mixed_precision_4bit
    role: extraction_default
    default_thinking_mode: non_thinking
    structured_output_retries: 2
    allow_structured_output_reasoning_fallback: true
    timeout_seconds: 60.0
  embedding:
    provider: local
    model_name: Qwen/Qwen3-Embedding-0.6B
    dimension: 1024
    context_length: 32768
    normalize_embeddings: true
    instruction_aware: true
    store_full_vectors_in_json: true
  reranker:
    provider: local
    model_name: Qwen/Qwen3-Reranker-0.6B
    context_length: 32768
    top_k_before_rerank: 50
    top_k_after_rerank: 8
    instruction_aware: true

normalization:
  tag_entity_normalization: lowercase_trim_collapse_spaces
